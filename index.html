// ================= WAVE C · NPC LIFE: SHOPKEEPERS · YOUR AVATAR · TRINKETS & TRADING · GUILDS =================
let keepers=[],avatar=null,kSyncT=0;
function keeperSpots(a){const t=objT(a);const fp=tilesOf(a);const set=new Set(fp);const out=[];fp.forEach(i=>{const x=i%W,y=(i/W)|0;for(const[dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const n=idx(nx,ny);if(set.has(n)||!walkV(nx,ny))continue;if(!out.some(o=>o[0]===nx&&o[1]===ny))out.push([nx,ny]);}});
  try{const[cx,cy]=objCenter(a);const th=objAngle(t,a,(S.rot&&S.rot[a])||0);const vp=vendorPos(t,cx,cy,th);out.sort((p,q)=>Math.hypot(p[0]*T+4-vp.wx,p[1]*T+4-vp.wy)-Math.hypot(q[0]*T+4-vp.wx,q[1]*T+4-vp.wy));}catch(_){}return out;}
const KNAMES=['Ozzie','Brix','Marta','Pell','Juno','Hask','Wren','Tibbs','Dorra','Fenn','Quill','Sable'];
function keeperSync(){const want={};for(let a=0;a<W*H;a++){const t=objT(a);if(!t||anchorOf(a)!==a||!VENDOR[t]||isRuin(a))continue;try{if(VENDOR[t].need&&!VENDOR[t].need(a))continue;}catch(_){continue;}want[a]=t;}
  keepers=keepers.filter(k=>want[k.a]===k.t);
  for(const a in want){const A=+a;let k=keepers.find(x=>x.a===A);const sp=keeperSpots(A);if(k){k.spots=sp;if(!sp.length)keepers=keepers.filter(x=>x!==k);continue;}if(!sp.length)continue;const t=want[a],V=VENDOR[t];
    k={kind:'k',id:uid++,a:A,t,name:KNAMES[A%KNAMES.length],x:sp[0][0]*T+4,y:sp[0][1]*T+6,ox:0,oy:0,path:[],dir:1,walkT:0,mvT:0,lunge:0,state:'work',timer:rnd(2,6),look:{type:'human',pal:V.pal,hat:V.hat},spots:sp,home:sp[0],bubble:null};keepers.push(k);}}
function keeperBusy(k){return visitors.some(v=>v.target===k.a&&(v.state==='eating'||v.state==='betting'||v.state==='drinking'||v.state==='dining'||v.state==='queue'||v.state==='buying'));}
function updKeeper(k,dt){if(k.bubble){k.bubble.t-=dt;if(k.bubble.t<=0)k.bubble=null;}if(k.mvT>0)k.mvT-=dt;if(k.lunge>0)k.lunge-=dt;const V=VENDOR[k.t]||{};
  if(k.path.length){k.frameOverride=null;moveAlong(k,dt,24);return;}
  const[cx,cy]=objCenter(k.a);const face=()=>{const sd=(cx-k.x)-(cy-k.y);if(Math.abs(sd)>.5)k.dir=sd>0?1:-1;};
  const busy=keeperBusy(k);k.timer-=dt;
  if(k.state==='work'){face();const ph=Math.sin(gt*(busy?8:4)+k.id);k.frameOverride=(busy||V.work)&&ph>.2?4:0;
    if(V.work&&ph>.97)sparks(cx,cy,1);if(busy&&Math.random()<dt*.25&&!k.bubble)say(k,pick(V.lines||['Next!']),1.6);
    if(!busy&&k.timer<=0){k.timer=rnd(5,10);if(k.spots.length>1&&Math.random()<.65){const s2=pick(k.spots.slice(1));const p=findPath(...tileOf(k),(x,y)=>x===s2[0]&&y===s2[1],walkV);if(p){k.path=p;k.state='tidy';k.timer=rnd(2,4);}}}}
  else if(k.state==='tidy'){face();k.frameOverride=Math.sin(gt*6+k.id)>0?4:0;if(Math.random()<dt*3){const[i,j]=iso(k.x,k.y);particles.push({x:i+rnd(-3,3),y:j-1,vx:rnd(-8,8),vy:rnd(-12,-4),t:.35,c:'#d8c49a',sz:1});}
    if(k.timer<=0||busy){const h=k.spots[0];const p=findPath(...tileOf(k),(x,y)=>x===h[0]&&y===h[1],walkV);k.path=p||[];k.state='work';k.timer=rnd(4,9);}}}
function drawKeeperFallback(a){return !keepers.some(k=>k.a===a);}
function wallGuard(){const chk=e=>{if(!e||e.x==null)return;const tx=Math.floor(e.x/T),ty=Math.floor(e.y/T);const bad=inb(tx,ty)&&S.ground[idx(tx,ty)]===WA;if(bad&&e._gx!=null){e.x=e._gx;e.y=e._gy;if(e.path&&e.path.length){const p=findPath(Math.floor(e.x/T),Math.floor(e.y/T),(x,y)=>{const l=e.path[e.path.length-1];return x===l[0]&&y===l[1];},walkV);e.path=p||[];}}else if(!bad){e._gx=e.x;e._gy=e.y;}};
  visitors.forEach(v=>{if(!v.dead)chk(v);});idlers.forEach(chk);workers.forEach(chk);keepers.forEach(chk);crew.forEach(chk);if(avatar)chk(avatar);}
function genstoreTick(){const sts=[];for(let a=0;a<W*H;a++)if(objT(a)==='genstore'&&anchorOf(a)===a&&!isRuin(a))sts.push(a);sts.forEach(a=>{const[cx,cy]=objCenter(a);const v=visitors.find(o=>o.kind==='v'&&!o.raider&&o.state!=='leave'&&Math.hypot(o.x-cx,o.y-cy)<48&&(o.items||[]).length<3);if(!v||Math.random()>.5)return;const k=pick(Object.keys(TRINKETS));const pr=Math.round(TRINKETS[k].v*locMul());S.gold+=pr;giveTrinket(v,k);S.gsold=S.gsold||{};S.gsold[S.day]=(S.gsold[S.day]||0)+1;popAt('🛍 '+TRINKETS[k].ic+' +'+pr+'g',v.x,v.y,'#ffe066',1400);play('coin');});}

function avatarSync(){if(!S||!S.player||!S.player.look||S.over){avatar=null;return;}if(avatar)return;const[gx,gy]=exitGoal();avatar={kind:'p',id:uid++,name:S.player.name||'You',x:gx*T+4,y:(gy-1)*T+6,ox:0,oy:0,path:[],dir:1,walkT:0,mvT:0,lunge:0,state:'idle',timer:1,look:S.player.look,bubble:null,job:null};}
function updAvatar(e,dt){if(e.bubble){e.bubble.t-=dt;if(e.bubble.t<=0)e.bubble=null;}if(e.mvT>0)e.mvT-=dt;e.look=S.player.look;
  if(e.path.length){e.frameOverride=null;moveAlong(e,dt,40);return;}
  e.timer-=dt;const near=(x,y,r)=>Math.hypot(x-e.x,y-e.y)<r;
  if(e.state==='work'){e.frameOverride=Math.sin(gt*9)>0?4:0;if(Math.random()<dt*4&&e.job&&e.job.k==='build'){const[cx,cy]=objCenter(e.job.a);sparks(cx,cy,1);}
    if(e.timer>0)return;const j=e.job;e.frameOverride=null;e.state='idle';e.timer=rnd(.6,1.4);
    if(j&&j.k==='order'){const o=orders.find(o=>o===j.o&&o.st==='call');if(o){o.st='wait';const v=visitors.find(x=>x.id===o.vid);if(v){const t2=spend(v,o.pat<6?2:1);S.gold+=t2;popAt('📝 '+recipeBy(o.rec).n+(t2?' · +'+t2+'g':''),v.x,v.y,'#ffe9a8',1500);}say(e,pick(['Coming right up!','One '+recipeBy(o.rec).n+'!','Got it.']),1.4);}}
    else if(j&&j.k==='mop'){decals=decals.filter(d=>Math.hypot(d.x-e.x,d.y-e.y)>22);gibs=gibs.filter(g=>g.z>0||Math.hypot(g.x-e.x,g.y-e.y)>22||busyArenaPx(g.x,g.y));say(e,pick(['Spotless.','There we go.','Who keeps doing this?']),1.2);}
    else if(j&&j.k==='pile'){const p=(S.piles||[]).find(p=>p===j.p);if(p)claimPile(p);}
    else if(j&&j.k==='greet'){const v=visitors.find(x=>x===j.v);if(v){v.mood=Math.min(100,v.mood+6);say(e,pick(['Welcome to the sands!','Enjoying the show?','Best seats are up front!']),1.6);say(v,pick(['Oh! The owner!','Big fan!','Nice place!']),1.4);}}
    else if(j&&j.k==='build'){say(e,pick(['Tighten that bolt…','Looking good.','*clang*']),1.2);}
    e.job=null;return;}
  if(e.timer>0)return;e.timer=rnd(.8,1.6);const[tx,ty]=tileOf(e);const go=(gx,gy,job,dur)=>{const p=findPath(tx,ty,(x,y)=>Math.abs(x-gx)<=1&&Math.abs(y-gy)<=1&&walkW(x,y),walkW);if(p){e.path=p;e.job=job;e.state='work';e.timer=dur+p.length*.2;return true;}return false;};
  // 1) diners calling for an order
  const call=orders.find(o=>o.st==='call');if(call){const v=visitors.find(x=>x.id===call.vid);if(v&&go(Math.floor(v.x/T),Math.floor(v.y/T),{k:'order',o:call},1.2))return;}
  // 2) gold piles on the sand
  const pl=(S.piles||[])[0];if(pl&&go(Math.floor(pl.x/T),Math.floor(pl.y/T),{k:'pile',p:pl},.6))return;
  // 3) construction
  const cons=Object.keys(S.ruin||{}).map(Number).find(a=>S.ruin[a]===3&&objT(a));if(cons!=null){const[cx,cy]=objCenter(cons);if(go(Math.floor(cx/T),Math.floor(cy/T),{k:'build',a:cons},1.6))return;}
  // 4) mess (only if no robots)
  if(!workers.some(w=>w.kind==='w')){const m=decals.find(d=>!busyArenaPx(d.x,d.y));if(m&&go(Math.floor(m.x/T),Math.floor((m.y-2)/T),{k:'mop'},1.4))return;}
  // 5) greet a fan or inspect a building
  if(Math.random()<.5&&visitors.length){const v=pick(visitors.filter(x=>x.kind==='v'&&!x.raider&&x.state!=='leave'));if(v&&go(Math.floor(v.x/T),Math.floor(v.y/T),{k:'greet',v},1))return;}
  const anc=[];for(let a=0;a<W*H;a+=1)if(objT(a)&&anchorOf(a)===a)anc.push(a);if(anc.length){const a=pick(anc);const[cx,cy]=objCenter(a);go(Math.floor(cx/T),Math.floor(cy/T),{k:'build',a},1.2);}}

function giveTrinket(e,k){e.items=e.items||[];if(e.items.length<4)e.items.push(k);}

const SQBY=Object.fromEntries(SQ.map(q=>[q.id,q]));
function ensureSQ(){S.sq=S.sq||{};}
const sqState=id=>{ensureSQ();return S.sq[id]||null;};
function sqCastLine(q,[who,text]){const c=who==='P'?{n:(S.player&&S.player.name)||'You',look:PLK}:who==='N'?{n:'',look:NARR}:q.cast[who]||{n:who,look:NARR};const lk=typeof c.look==='function'?c.look():c.look;return {who:c.n,look:lk,narr:who==='N',text:text.replace(/\{p\}/g,(S.player&&S.player.name)||'friend')};}
function sqDialog(q,lines,cb){if(!lines||!lines.length){cb&&cb();return;}dialog(lines.map(l=>sqCastLine(q,l)),cb);}
function sqBegin(id){ensureSQ();const q=SQBY[id];S.sq[id]={i:0,done:0,c:{}};sqEnterStep(q);save();}
function sqEnterStep(q){const st=S.sq[q.id],s=q.steps[st.i];if(!s){sqFinish(q);return;}if(s.start)s.start(st.c);
  if(s.k==='talk'){sqDialog(q,s.lines,()=>sqAdvance(q.id));return;}if(s.pre&&!st.c['pre'+st.i]){st.c['pre'+st.i]=1;sqDialog(q,s.pre);}toast(`${q.ic} ${q.n}: ${s.d}`,3500);}
function sqAdvance(id){const q=SQBY[id],st=S.sq[id];if(!st||st.done)return;const s=q.steps[st.i];const go=()=>{st.i++;if(st.i>=q.steps.length)sqFinish(q);else{toast(`${q.ic} ${q.n} — step ${st.i+1}/${q.steps.length}: ${q.steps[st.i].d}`,4000);sqEnterStep(q);}save();};if(s&&s.post&&s.k!=='talk')sqDialog(q,s.post,go);else go();}
function sqFinish(q){const st=S.sq[q.id];st.done=1;const rw=(q.steps[q.steps.length-1].rw)||{};const m=locMul();if(rw.gold)S.gold+=Math.round(rw.gold*m);if(rw.fame)S.fame+=rw.fame;if(rw.water){ensureEco();S.water=Math.min(waterCap(),S.water+rw.water);}if(rw.gift)try{giveGift(rw.gift,true);}catch(_){}
  if(rw.shawna&&!S.roster.some(f=>f.name==='Shawna')){const f=newFighter('sagittarius',Math.max(10,lvlNow()+3));f.name='Shawna';f.pal=Object.assign({},CLK('Shawna')().pal);f.legend=1;f.status='ready';f.color='#5bcefa';S.roster.push(f);toast('🛡 Shawna joins your roster!',4000);}
  play('level');toast(`${q.ic} ${q.n} complete! +${Math.round((rw.gold||0)*m)}g · ⭐+${rw.fame||0}`,5000);save();}
function sqAct(id){const q=SQBY[id],st=S.sq[id];if(!st||st.done)return;const s=q.steps[st.i];
  if(s.k==='fight'||s.k==='solo'){const o=Object.assign(s.fight(),{sq:{id,step:st.i}});if(s.k==='solo'){if(!freeArena()){toast('Every arena is busy — try again in a moment');play('error');return;}o.solo=s.solo();o.rig=s.rig;closeModal();startBout(o,[]);}else{const ids=selIds.length?selIds.slice():S.roster.filter(canFight).sort((a,b)=>b.lvl-a.lvl).slice(0,Math.min(3,o.enemies.length)).map(f=>f.id);closeModal();queueOrStart(o,ids);}return;}
  if(s.k==='pay'){const c=Math.round(s.cost*locMul());if(S.gold<c){toast('Need '+c+'g');play('error');return;}S.gold-=c;play('coin');sqAdvance(id);return;}
  if(s.k==='final'){closeModal();sqScene(q,ok=>{if(ok)sqAdvance(id);else toast(`${q.ic} You retreated — try the final scene again any time from the Journal`,4000);});return;}
  if(s.k==='goal'){if(s.ok(st.c))sqAdvance(id);else toast('Not yet: '+s.d,2500);}}
function sqScene(q,cb){const s=q.steps.find(x=>x.k==='final');if(!s)return cb&&cb(true);const sc=s.scene;const cast={};for(const k in sc.cast){const base=k==='p'?{look:PLK}:q.cast[k]||{};cast[k]=Object.assign({look:base.look},sc.cast[k]);}
  const steps=sc.steps.map(x=>Object.assign({},x,{who:(x.who||'').replace(/\{p\}/g,(S.player&&S.player.name)||'You')}));playScene({title:sc.title,sub:(sc.sub||'').replace(/\{p\}/g,(S.player&&S.player.name)||'You'),bg:sc.bg,track:sc.track,cast,steps},cb);}
function sqTick(){if(!S)return;ensureSQ();for(const q of SQ){const st=S.sq[q.id];if(!st){if(!S.sqSeen||!S.sqSeen[q.id]){let ok=false;try{ok=q.unlock();}catch(_){}if(ok){S.sqSeen=S.sqSeen||{};S.sqSeen[q.id]=1;toast(`📖 New side story: ${q.ic} ${q.n} — open the Journal to begin`,5000);play('level');}}continue;}if(st.done)continue;const s=q.steps[st.i];if(s&&s.k==='goal'){let ok=false;try{ok=s.ok(st.c);}catch(_){}if(ok)sqAdvance(q.id);}}}
function sqBoutDone(b){const o=b.opt;if(!o.sq)return;const st=S.sq&&S.sq[o.sq.id];if(!st||st.i!==o.sq.step)return;if(b.win==='A')setTimeout(()=>sqAdvance(o.sq.id),1500);else toast('📖 '+SQBY[o.sq.id].n+': you lost that one — try the bout again from the Journal',4000);}
function sqHTML(){ensureSQ();let h=`<h3 style="margin-top:8px">📖 SIDE STORIES</h3>`;for(const q of SQ){const st=S.sq[q.id];let ok=false;try{ok=q.unlock();}catch(_){}
  if(!st){h+=`<div class="q"><span>${ok?q.ic:'🔒'} ${ok?q.n:'???'} <span class="small">${ok?q.tag:'keep growing your arena'}</span></span>${ok?`<button class="mini" data-m="sqgo" data-v="${q.id}">Begin ▸</button>`:''}</div>`;continue;}
  if(st.done){h+=`<div class="q"><span>✅ ${q.n} <span class="small">${q.tag}</span></span><button class="mini" data-m="sqre" data-v="${q.id}">▶ Replay finale</button></div>`;continue;}
  const s=q.steps[st.i];const btn=s.k==='fight'?'⚔ Fight':s.k==='solo'?'🏟 Enter':s.k==='pay'?`💰 ${Math.round(s.cost*locMul())}g`:s.k==='final'?'🎬 Final scene':s.k==='goal'?'Check':'';
  h+=`<div class="q" style="background:rgba(216,166,72,.12)"><span>❗ ${q.ic} ${q.n} <span class="small">${st.i+1}/${q.steps.length} · ${s.d}</span></span>${btn?`<button class="mini" data-m="sqact" data-v="${q.id}">${btn}</button>`:''}</div>`;}return h;}

function dbgqHTML(){ensureSQ();let h=`<div class="mhead"><h3 style="margin:0">📖 QUESTLINES & CUTSCENES</h3><button data-m="debug">← Debug</button></div><div class="small">Jump to any step of any questline, or watch any cutscene.</div>`;
  h+=`<h3 style="margin-top:6px">🎬 CUTSCENES</h3><div class="row" style="flex-wrap:wrap;gap:4px">${[['intro','▶ Intro'],['inspect','🕵 Final audit'],['credits','🎬 Credits'],['demoend','✦ Demo end'],['move','🏗 Fighters move-in'],['loc','📍 Relocation']].map(([v,l])=>`<button class="mini" data-m="dqc" data-v="${v}">${l}</button>`).join('')}</div>`;
  h+=`<h3 style="margin-top:8px">📖 SIDE STORIES</h3>`+SQ.map(q=>{const st=S.sq[q.id];return `<div style="margin:4px 0"><div class="small" style="color:#ffd98a">${q.ic} ${q.n} <span style="opacity:.7">· ${q.tag}${st?(st.done?' · ✅ done':' · step '+(st.i+1)):''}</span></div><div class="row" style="flex-wrap:wrap;gap:3px">${q.steps.map((x,k)=>`<button class="mini" data-m="dqs" data-v="${q.id}:${k}" title="${x.d}">${k+1}. ${x.k==='final'?'🎬':x.k==='fight'?'⚔':x.k==='solo'?'🏟':x.k==='goal'?'🎯':x.k==='pay'?'💰':'💬'}</button>`).join('')}<button class="mini" data-m="dqf" data-v="${q.id}">▶ Watch finale</button></div></div>`;}).join('');
  h+=`<h3 style="margin-top:8px">📜 MAIN STORY (Chapter 1)</h3><div class="row" style="flex-wrap:wrap;gap:3px">${STORY.map((x,k)=>`<button class="mini ${S.ql&&S.ql.i===k?'on':''}" data-m="dqm" data-v="${k}" title="${(x.goal&&x.goal.d)||(x.fight&&x.fight.label)||''}">${k+1}</button>`).join('')}</div><div class="small">${STORY.map((x,k)=>(k+1)+'. '+(x.ch||'')+' — '+((x.goal&&x.goal.d)||(x.fight&&x.fight.label)||'')).join('<br>')}</div>`;
  h+=`<h3 style="margin-top:8px">📖 RARE STORIES</h3>`+STORIES.map(st=>`<div class="row" style="flex-wrap:wrap;gap:3px"><span class="small">${st.n}</span>${st.ch.map((c,i)=>`<button class="mini" data-m="dqr" data-v="${st.id}:${i}">Ch ${i+1}</button>`).join('')}</div>`).join('');
  h+=`<h3 style="margin-top:8px">🛩 SURFACE LORE</h3>`+Object.keys(MLORE).map(k=>`<div class="row" style="flex-wrap:wrap;gap:3px"><span class="small">${MISSIONS[k].ic} ${MISSIONS[k].n}</span>${MLORE[k].map((l,i)=>`<button class="mini" data-m="dql" data-v="${k}:${i}">Scene ${i+1}</button>`).join('')}</div>`).join('');
  return h;}

    const pr=hirePrice(f);if(S.gold<pr){toast('Not enough gold — need '+pr+'g');return;}S.gold-=pr;delete f.price;f.status='ready';f.color=freeColor();S.roster.push(f);S.market[i]=null;visitors.forEach(v=>{if(v.ops)v.ops[f.id]=+rnd(-.3,.5).toFixed(2);});play('hire');toast('🛡 '+f.name+' joins your ludus!');save();}

  else if(a==='sell'){const id=+b.dataset.id,f=S.roster.find(r=>r.id===id);if(f&&f.status!=='fighting'&&S.roster.length>1){if(pendingSell!==id){pendingSell=id;play('error');renderPanel();return;}pendingSell=null;startExecution(f);}}

  renderPanel();});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{play('click');activeTab=activeTab===b.dataset.tab?null:b.dataset.tab;if(activeTab==='bout'&&!selIds.length)autoSel();if(activeTab!=='build'){dropHeld();tool=null;paintStart=null;}else if(buildMode!=='items')tool=buildMode==='move'?'move':'erase';renderPanel();});

const SPEEDS=[1,2,3,5,20,0];let userPause=false;document.getElementById('bmoveBtn').onclick=()=>{play('click');openModal('bmove');};document.getElementById('speed').onclick=e=>{play('click');if(activeTab==='build'){toast('⏸ Paused while building',1500);return;}const SP=SPEEDS.filter(x=>x>0);speed=SP[(SP.indexOf(speed)+1)%SP.length]||1;e.target.textContent=speed+'×';};

const dayMin=()=>(360+S.dayT/120*1440)%1440;const hourNow=()=>dayMin()/60;
function darkness(){const h=hourNow();if(h>=7&&h<17)return 0;if(h>=17&&h<20.5)return (h-17)/3.5*.62;if(h>=20.5||h<4.5)return .62;return (6.5-h)/2*.62;}
function clockTxt(){const m=Math.floor(dayMin()),h=Math.floor(m/60),mm=String(m%60-m%10).padStart(2,'0');return `D${S.day} ${((h+11)%12)+1}:${mm}${h<12?'a':'p'}`;}
function vibeBreakdown(cx,cy){const out=[];for(let a=0;a<W*H;a++){const t=S.ceil&&S.ceil[a];if(!t)continue;const d=CEIL[t];if(Math.hypot((a%W)*T+4-cx,((a/W)|0)*T+4-cy)<=d.r*T)out.push([d.name+' (ceiling)',d.beauty]);}for(let a=0;a<W*H;a++){const t=objT(a);if(!t)continue;const d=OBJ[t];if(d.cat!=='deco'&&d.cat!=='show')continue;const[ox,oy]=objCenter(a);const r=d.cat==='show'?3:d.r;if(Math.hypot(ox-cx,oy-cy)<=r*T)out.push([d.name,d.cat==='show'?.6:d.beauty]);}return out;}
function updVibeTip(){const el=document.getElementById('vtip');if(activeTab!=='build'){el.style.display='none';return;}const[x,y]=aimTile();if(!inb(x,y)){el.style.display='none';return;}
  const a=anchorOf(idx(x,y));let name,cx,cy;if(a>=0){name=OBJ[S.objs[a]].name;[cx,cy]=objCenter(a);}else{name=['Grass','Floor','Sand','Wall','Gate'][S.ground[idx(x,y)]];cx=x*T+4;cy=y*T+4;}
  const br=vibeBreakdown(cx,cy);const tot=br.reduce((s,b)=>s+b[1],0);const agg={};br.forEach(([n,v])=>{agg[n]=agg[n]||[0,0];agg[n][0]++;agg[n][1]+=v;});
  const html=`<b>${name}</b> · ✨ aura ${tot.toFixed(1)}<br><span class="small">${Object.keys(agg).length?Object.entries(agg).map(([n,[c,v]])=>`${n}${c>1?' ×'+c:''} +${v.toFixed(1)}`).join('<br>'):'No decorations nearby'}</span>`;
  if(el.innerHTML!==html)el.innerHTML=html;el.style.display='block';}
function updHUD(){try{supStrip();}catch(_){}try{bmoveTick();}catch(_){}try{tabBadges();}catch(_){}evBanner();questPopTick();achTick();{const n=(S.reqs||[]).length+(visitors.some(v=>v.qg&&!v.qg.taken)?1:0);const el=document.getElementById('jn');const t=n?String(n):'';if(el.textContent!==t)el.textContent=t;}updVibeTip();S.ms=S.ms||{};MILESTONES.forEach(([n,d,f])=>{if(!S.ms[n]&&f()){S.ms[n]=1;if(!booting&&S.bouts+S.day>1){toast('📜 Milestone: '+n,3500);play('level');}}});S.seenU=S.seenU||{};for(const t of ['cushion','vip','fanseat']){if(unlocked(t)&&!S.seenU[t]){S.seenU[t]=1;if(OBJ[t].unlock.fame){toast('🔓 Unlocked: '+OBJ[t].name,3500);play('level');}if(activeTab==='build')renderPanel();}}if(paint&&paintStart&&activeTab==='build'&&tool){const a=document.getElementById('act'),t=actLabel();if(a.textContent!==t)a.textContent=t;}const g=document.getElementById('sGold');g.textContent='💰 '+Math.floor(S.gold);g.classList.toggle('neg',S.gold<0);
  document.getElementById('sFame').textContent='⭐ '+S.fame.toFixed(0);document.getElementById('sVis').textContent='👥 '+visitors.length;
  {const el=document.getElementById('sDay');const fr=(dayMin()/1440);el.innerHTML=`<span class="dial" style="background:conic-gradient(#e8b23a ${Math.round(fr*360)}deg,#3a2410 0)"></span>`+clockTxt();const hn=hourNow();el.style.background=hn>=20||hn<6?'rgba(30,40,90,.55)':hn>=17?'rgba(120,50,30,.5)':'';}

function applyEcon(){const m=LOCS[PLOTS[plotLv(S)].loc].mul*pw('build');for(const k in OBJ)OBJ[k].cost=Math.round(OBJ[k]._b*m/5)*5;for(const k in CEIL){if(CEIL[k]._b==null)CEIL[k]._b=CEIL[k].cost;CEIL[k].cost=Math.round(CEIL[k]._b*m);}}
function bootFrom(d){
  S=d||freshState();try{migrateRooms(S);}catch(e){console.error(e);}_pm={};if(S.exp!=null){try{stampGround(S);}catch(e){}}if(!S.ceil||S.ceil.length!==W*H)S.ceil=new Array(W*H).fill(null);migrateItems();S.roster.forEach(f=>fillFighter(f));if(!S.rot)S.rot={};S.roster.forEach(f=>{if(f.status==='fighting')f.status='ready';if(f.status==='away'&&!(S.exped||[]).some(e=>e.ids.includes(f.id)))f.status='ready';});

}
